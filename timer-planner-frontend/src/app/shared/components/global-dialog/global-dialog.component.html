@if (dialogService.state(); as d) {
<div class="dialog-backdrop" (click)="onCancel()">
    <dialog #nativeDialog class="native-dialog" (click)="$event.stopPropagation()">
        <h2 class="dialog-title">{{ d.title }}</h2>
        <div class="dialog-content">
            <p>{{ d.message }}</p>
            @if (d.requireText) {
            <input class="confirm-input" type="text" autocomplete="off" placeholder="Escribe el título para confirmar"
                [value]="typedText()" (input)="typedText.set($any($event.target).value)"
                (keydown.enter)="onConfirm()">
            }
            @if (d.numberDefault !== undefined) {
            <label class="confirm-label">{{ d.numberLabel }}
                <input class="confirm-input" type="number" min="1" step="1" inputmode="numeric"
                    [value]="numberText(d.numberDefault)" (input)="typedNumber.set($any($event.target).value)"
                    (keydown.enter)="onConfirm()">
            </label>
            }
            @if (d.askDate) {
            <label class="confirm-label">{{ d.dateLabel }}
                <input class="confirm-input" type="date" [attr.min]="d.dateMin" [attr.max]="d.dateMax"
                    [value]="typedDate()" (input)="typedDate.set($any($event.target).value)"
                    (keydown.enter)="onConfirm()">
            </label>
            }
        </div>
        <div class="dialog-actions">
            @if (d.type === 'confirm') {
            <button class="btn-secondary" (click)="onCancel()">{{ d.cancelText }}</button>
            }
            <button [class]="d.isDanger ? 'btn-danger' : 'btn-primary'" [disabled]="!canConfirm(d.requireText, d.numberDefault, dateRange(d))" (click)="onConfirm()">
                {{ d.confirmText }}
            </button>
        </div>
    </dialog>
</div>
}
