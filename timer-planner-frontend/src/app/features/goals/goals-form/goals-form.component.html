<div class="form-container">
  <header>
    <h1>{{ isEditMode ? 'Editar Meta' : 'Nueva Meta' }}</h1>
    <p>{{ isEditMode ? 'Modifica los detalles de tu objetivo.' : 'Define un nuevo objetivo en tu sistema.' }}</p>
  </header>

  <form [formGroup]="goalForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="title">Título de la Meta</label>
      <input id="title" type="text" formControlName="title"
        [class.invalid]="goalForm.get('title')?.invalid && goalForm.get('title')?.touched">
    </div>


    <div class="form-group">
      <label for="horizon">Horizonte (opcional)</label>
      <select id="horizon" formControlName="horizon">
        <option [ngValue]="null">Sin horizonte (idea)</option>
        @for (h of horizons; track h) {
        <option [ngValue]="h">{{ h | label: horizonLabels }}</option>
        }
      </select>
    </div>


    <div class="actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancelar</button>
      <button type="submit" class="btn-save" [disabled]="goalForm.invalid">
        {{ isEditMode ? 'Guardar Cambios' : 'Crear Meta' }}
      </button>
    </div>

  </form>
</div>
